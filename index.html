<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>La sosta al punto giusto</title>


    <link rel="stylesheet" href="css/style.css">


    <link rel="stylesheet" 
    href="https://unpkg.com/leaflet/dist/leaflet.css" />


</head>


<body>


<div class="container">


    <header>

        <h1>🚐 La sosta al punto giusto</h1>

        <p>
            Un regalo di Marco per i pianificatori seriali di viaggi in camper
        </p>

        <small>
            Versione 1.6.1a
        </small>

    </header>



    <section class="input-area">


        <label for="start">
            Partenza
        </label>

        <div class="autocomplete">
            <div class="location-row">
                <button
                    id="selectStartOnMap"
                    type="button"
                    class="map-select-btn"
                    title="Seleziona dalla mappa">📍</button>
                <input
                    id="start"
                    type="text"
                    placeholder="Inserisci località di partenza"
                    autocomplete="off">
            </div>
            <div id="startSuggestions" class="suggestions"></div>
        </div>


        <label for="stop">
            Tappa (facoltativa)
        </label>

        <div class="autocomplete">
            <div class="location-row">
                <button
                    id="selectStopOnMap"
                    type="button"
                    class="map-select-btn"
                    title="Seleziona dalla mappa">📍</button>
                <input
                    type="text"
                    id="stop"
                    placeholder="Tappa intermedia (facoltativa)"
                    autocomplete="off">
            </div>
            <div id="stopSuggestions" class="suggestions"></div>
        </div>


        <label for="end">
            Destinazione
        </label>

        <div class="autocomplete">
            <div class="location-row">
                <button
                    id="selectEndOnMap"
                    type="button"
                    class="map-select-btn"
                    title="Seleziona dalla mappa">📍</button>
                <input
                    type="text"
                    id="end"
                    placeholder="Destinazione"
                    autocomplete="off">
            </div>
            <div id="endSuggestions" class="suggestions"></div>
        </div>


        <label for="camperSpeedFactor">
            Velocità del camper rispetto alla velocità standard con un'auto (%).. si consiglia circa 85% 
        </label>

        <input
        id="camperSpeedFactor"
        type="number"
        min="50"
        max="110"
        value="85">



        <label for="departureTime">
            Ora di partenza
        </label>

        <input
        id="departureTime"
        type="time"
        value="08:30">



        <label for="stopTime">
            Ora desiderata della sosta
        </label>

        <input
        id="stopTime"
        type="time"
        value="18:00">


        <button id="routeButton">
            CALCOLA PERCORSO
        </button>

        <button id="clearButton">
    NUOVO VIAGGIO
</button>

    </section>



    <section id="results">


    </section>



    <div id="mapSelectionHint" class="map-hint" style="display:none;"></div>

    <div id="map"></div>


</div>


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script src="js/map.js"></script>

<script src="js/routing.js"></script>

<script src="js/storage.js"></script>

<script src="js/autocomplete.js"></script>
    
<script src="js/app.js"></script>


</body>

</html>
<!-- fine index.html -->
