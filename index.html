<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Camper Planner</title>

<link rel="stylesheet" href="css/style.css">

<link
rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

</head>

<body>

<header>

<h1>🚐 Camper Planner</h1>
<div id="version">Versione 0.1 - Routing funzionante</div>

</header>

<div class="container">

<div class="card">

<label>Partenza</label>
<input id="start" type="text">

<label>Tappa (facoltativa)</label>
<input id="waypoint" type="text">

<label>Arrivo</label>
<input id="end" type="text">

<label>Velocità camper rispetto allo standard (%)</label>

<input 
id="camperSpeedFactor"
type="number"
min="30"
max="120"
placeholder="es. 85">

<button id="routeButton">

Calcola percorso

</button>

<div id="results">

</div>

</div>

<div id="map"></div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="js/map.js"></script>

<script src="js/routing.js"></script>

<script src="js/app.js"></script>

</body>
</html>
