<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>La sosta al punto giusto</title>


    <link rel="stylesheet" href="css/style.css">


    <link rel="stylesheet" 
    href="https://unpkg.com/leaflet/dist/leaflet.css" />


</head>


<body>


<div class="container">


    <header>

        <h1>🚐 La sosta al punto giusto</h1>

        <p>
            Un regalo di Marco per i pianificatori seriali di viaggi in camper
        </p>

        <small>
            Versione 1.5.1
        </small>

    </header>



    <section class="input-area">


        <label for="start">
            Partenza
        </label>

        <div class="autocomplete">

<div class="autocomplete">

<input 
id="start"
type="text"
placeholder="Inserisci località di partenza">

<div id="startSuggestions" class="suggestions"></div>

</div>

<div id="startSuggestions"></div>

</div>


        <label for="stop">
            Tappa (facoltativa)
        </label>
<div class="autocomplete">

<input 
id="stop"
type="text"
placeholder="Eventuale tappa intermedia per forzare il percorso secondo una tua scelta">

<div id="startSuggestions"></div>

</div>



        <label for="end">
            Destinazione
        </label>

        <div class="autocomplete">

<div class="autocomplete">

<input 
id="end"
type="text"
placeholder="Inserisci destinazione finale">

<div id="endSuggestions" class="suggestions"></div>

</div>

<div id="startSuggestions"></div>

</div>



        <label for="camperSpeedFactor">
            Velocità del camper rispetto alla velocità standard con un'auto (%).. si consiglia circa 85% 
        </label>

        <input
        id="camperSpeedFactor"
        type="number"
        min="50"
        max="110"
        value="85">



        <label for="departureTime">
            Ora di partenza
        </label>

        <input
        id="departureTime"
        type="time"
        value="08:30">



        <label for="stopTime">
            Ora desiderata della sosta
        </label>

        <input
        id="stopTime"
        type="time"
        value="18:00">


        <button id="routeButton">
            CALCOLA PERCORSO
        </button>

        <button id="clearButton">
    NUOVO VIAGGIO
</button>

    </section>



    <section id="results">


    </section>



    <div id="map"></div>


</div>


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script src="js/map.js"></script>

<script src="js/routing.js"></script>

<script src="js/storage.js"></script>

<script src="js/autocomplete.js"></script>
    
<script src="js/app.js"></script>


</body>

</html>
<!-- fine index.html -->
